  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); font-variant-numeric: tabular-nums; }

<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js"></script>
<script>
/* Anchor — data model and calculations. Pure functions, no DOM. */
var AnchorCore = (function () {
  var MN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // Demo: the 12-month plan always starts in the visitor's current month, so it never looks stale.
  var TODAY = (typeof ANCHOR_TODAY !== 'undefined' && ANCHOR_TODAY) ? ANCHOR_TODAY : new Date();
  var BASE_Y = TODAY.getFullYear(), BASE_M = TODAY.getMonth();
  function monthInfo(i) {
    var d = new Date(BASE_Y, BASE_M + i, 1), y = d.getFullYear(), m = d.getMonth();
    return { i: i, y: y, m: m, key: y + '-' + String(m + 1).padStart(2, '0'), label: MN[m] + ' ' + y, short: MN[m] };
  }
  var MONTHS = Array.from({ length: 12 }, function (_, i) { return monthInfo(i); });

  var PHASES = ['Cushion building', 'Cushion building', 'Cushion building', 'Debt payoff push', 'Insurance renewal',
    'Tax refund 💸', 'Raise kicks in', 'Steady', 'Vacation ✈️', 'Steady', 'Steady', 'Steady'];

  var CATEGORIES = [
    { name: 'Housing', icon: '🏠' }, { name: 'Transportation', icon: '🚗' }, { name: 'Food', icon: '🛒' },
    { name: 'Health', icon: '🏥' }, { name: 'Personal', icon: '📱' },
    { name: 'Subscriptions', icon: '📺' }, { name: 'Debt', icon: '💳' }
  ];

  // start/end are month indexes (inclusive). Omitted = whole plan. `paid` = demo actual when it differs from budget.
  var INCOME = [
    { id: 'wages', name: 'Paycheck', note: 'Paid 1st and 15th', amount: 3800 },
    { id: 'partner', name: 'Partner paycheck', note: 'Paid 7th and 21st', amount: 2400 },
    { id: 'side', name: 'Freelance work', amount: 600 },
    { id: 'raise', name: 'Annual raise', amount: 250, start: 6 },
    { id: 'refund', name: 'Tax refund', amount: 1150, start: 5, end: 5, oneTime: true }
  ];

  var EXPENSES = [
    { id: 'rent', cat: 'Housing', name: 'Rent', amount: 1650, due: 1 },
    { id: 'electric', cat: 'Housing', name: 'Electric', amount: 140, due: 10, approx: true, paid: 131 },
    { id: 'water', cat: 'Housing', name: 'Water', amount: 60, due: 15, approx: true, paid: 57 },
    { id: 'internet', cat: 'Housing', name: 'Internet', amount: 70, due: 12 },
    { id: 'renters', cat: 'Housing', name: "Renter's Insurance", amount: 15, due: 5, approx: true },
    { id: 'carpay', cat: 'Transportation', name: 'Car Payment', amount: 420, due: 1 },
    { id: 'autoins', cat: 'Transportation', name: 'Auto Insurance', amount: 160, due: 5, approx: true },
    { id: 'gas', cat: 'Transportation', name: 'Gas', amount: 150, pace: 0.85 },
    { id: 'groceries', cat: 'Food', name: 'Groceries', amount: 550, pace: 0.92 },
    { id: 'dining', cat: 'Food', name: 'Dining Out', amount: 200, pace: 1.12 },
    { id: 'health', cat: 'Health', name: 'Health Insurance', amount: 180, due: 1 },
    { id: 'phone', cat: 'Personal', name: 'Phone', amount: 90, due: 3 },
    { id: 'streaming', cat: 'Subscriptions', name: 'Streaming', amount: 45, due: 20, approx: true },
    { id: 'gym', cat: 'Subscriptions', name: 'Gym', amount: 30, due: 8 },
    { id: 'cardpay', cat: 'Debt', name: 'Credit Card Payments', amount: 300, due: 15, approx: true },
    { id: 'studentpay', cat: 'Debt', name: 'Student Loan', amount: 210, due: 20 }
  ];

  var ONE_TIME = [
    { id: 'registration', name: 'Car Registration', amount: 160, month: 0, oneTime: true },
    { id: 'insurance', name: 'Annual Insurance Premium', amount: 600, month: 4, oneTime: true },
    { id: 'vacation', name: 'Summer Vacation', amount: 1800, month: 8, oneTime: true }
  ];
  var SAVINGS = [
    { id: 'efund', name: 'Emergency Fund', amount: 800 },
    { id: 'vacfund', name: 'Vacation Fund', amount: 200 }
  ];

  var DEFAULT_CARDS = [
    { id: 'c1', name: 'Rewards Visa', bank: 'Big Bank', balance: 1240, limit: 5000, apr: 24.99, min: 40 },
    { id: 'c2', name: 'Store Card', bank: 'Retail Credit', balance: 380, limit: 1000, apr: 29.99, min: 25 },
    { id: 'c3', name: 'Travel Card', bank: 'Summit Bank', balance: 0, limit: 3000, apr: 21.49, min: null }
  ];
  var DEFAULT_LOANS = [
    { id: 'auto', name: 'Auto Loan', lender: 'Hometown Credit Union', balance: 14200, apr: 6.4, payment: 420 },
    { id: 'student', name: 'Student Loan', lender: 'Federal Direct', balance: 18500, apr: 5.5, payment: 210 }
  ];
  var DEFAULT_ASSETS = [
    { id: 'checking', group: 'Cash', name: 'Everyday Checking', value: 4200, note: 'Also your True Balance bank balance', fixed: true },
    { id: 'efund', group: 'Cash', name: 'Emergency Fund (savings)', value: 2500, note: 'High-yield savings', fixed: true },
    { id: 'brokerage', group: 'Investments', name: 'Brokerage', value: 8750, note: 'Index funds' },
    { id: 'retirement', group: 'Investments', name: '401(k)', value: 14300, note: '' },
    { id: 'car', group: 'Property', name: 'Car', value: 12000, note: 'Estimated resale value' }
  ];
  var ASSET_GROUPS = ['Cash', 'Investments', 'Property'];

  function clone(x) { return JSON.parse(JSON.stringify(x)); }

  // Demo seed: bills due so far are paid, paychecks that have landed are in, and variable
  // spending is paced through the month — so the demo looks lived-in on any date.
  function seedActuals() {
    var D = TODAY.getDate(), dim = new Date(BASE_Y, BASE_M + 1, 0).getDate(), pace = Math.min(1, D / dim), a = {};
    EXPENSES.forEach(function (l) {
      if (l.due && l.due <= D) a['exp:' + l.id] = l.paid != null ? l.paid : l.amount;
      if (l.pace) a['exp:' + l.id] = Math.round(l.amount * pace * l.pace);
    });
    a['inc:wages'] = D >= 15 ? 3800 : 1900;
    if (D >= 7) a['inc:partner'] = D >= 21 ? 2400 : 1200;
    if (D >= 10) a['inc:side'] = Math.round(600 * pace / 10) * 10;
    a['sav:efund'] = 400;
    if (D >= 15) a['sav:vacfund'] = 200;
    var out = {}; out[MONTHS[0].key] = a; return out;
  }
  // Six months of past net worth, so the trend chart has a story to tell.
  function seedHistory() {
    var past = [4100, 4650, 5300, 5900, 6400, 6950], h = {};
    past.forEach(function (v, k) { h[monthInfo(k - 6).key] = v; });
    return h;
  }

  function defaults() {
    return {
      v: 1, savedAt: 0, actuals: seedActuals(), bankUpdatedAt: TODAY.getTime() - 2 * 3600 * 1000,
      assets: clone(DEFAULT_ASSETS), cards: clone(DEFAULT_CARDS), loans: clone(DEFAULT_LOANS),
      settings: { lookahead: 14, includeSavings: true, reserved: { gas: true, groceries: true }, incomeEnd: {} },
      goals: { netWorth: 15000, emergency: 10000, vacation: 2000, vacationSaved: 650 },
      history: seedHistory()
    };
  }

  function hydrate(saved) {
    var d = defaults();
    if (!saved || typeof saved !== 'object') return d;
    var ss = saved.settings || {};
    return Object.assign({}, d, saved, {
      actuals: saved.actuals || {},
      history: saved.history || {},
      assets: Array.isArray(saved.assets) ? saved.assets : d.assets,
      cards: Array.isArray(saved.cards) ? saved.cards : d.cards,
      loans: Array.isArray(saved.loans) ? saved.loans : d.loans,
      settings: Object.assign({}, d.settings, ss, {
        reserved: Object.assign({}, d.settings.reserved, ss.reserved || {}),
        incomeEnd: Object.assign({}, ss.incomeEnd || {})
      }),
      goals: Object.assign({}, d.goals, saved.goals || {})
    });
  }

  /* ---------- months ---------- */
  function monthIndexOf(date) { return (date.getFullYear() - BASE_Y) * 12 + date.getMonth() - BASE_M; }
  function monthKeyOf(date) { return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0'); }
  function clampMi(mi) { return Math.min(11, Math.max(0, mi)); }
  function startOf(l) { return l.start == null ? 0 : l.start; }
  function endOf(l) { return l.end == null ? 11 : l.end; }
  function isActive(l, mi) { return mi >= startOf(l) && mi <= endOf(l); }
  function rangeText(l) {
    if (l.oneTime) return '';
    var s = startOf(l), e = endOf(l);
    if (s === 0 && e === 11) return '';
    if (e === 11) return 'From ' + MONTHS[s].short;
    return MONTHS[s].short + '–' + MONTHS[e].short;
  }
  function ordinal(n) {
    var s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  /* ---------- budget ---------- */
  function incomeLines(state) {
    return INCOME.map(function (l) {
      var e = state.settings.incomeEnd[l.id];
      return (e == null || l.oneTime) ? l : Object.assign({}, l, { end: e });
    });
  }
  function getActual(state, mi, key) {
    var m = state.actuals[MONTHS[mi].key];
    return m && m[key] != null ? m[key] : null;
  }
  function setActual(state, mi, key, val) {
    var mk = MONTHS[mi].key;
    var cur = Object.assign({}, state.actuals[mk] || {});
    if (val == null) delete cur[key]; else cur[key] = val;
    var next = Object.assign({}, state.actuals); next[mk] = cur;
    return Object.assign({}, state, { actuals: next });
  }
  function withActual(state, mi, prefix) {
    return function (l) {
      var key = prefix + l.id;
      return Object.assign({}, l, { key: key, planned: l.amount, actual: getActual(state, mi, key) });
    };
  }
  function monthLines(state, mi) {
    return {
      inc: incomeLines(state).filter(function (l) { return isActive(l, mi); }).map(withActual(state, mi, 'inc:')),
      exp: EXPENSES.filter(function (l) { return isActive(l, mi); }).map(withActual(state, mi, 'exp:')),
      one: ONE_TIME.filter(function (l) { return l.month === mi; }).map(withActual(state, mi, 'one:')),
      sav: SAVINGS.map(withActual(state, mi, 'sav:'))
    };
  }
  function sum(arr, f) { return arr.reduce(function (t, x) { var v = f(x); return t + (v || 0); }, 0); }
  var P = function (x) { return x.planned; }, A = function (x) { return x.actual; };

  function monthSummary(state, mi) {
    var L = monthLines(state, mi);
    var income = sum(L.inc, P), recurring = sum(L.exp, P), oneTime = sum(L.one, P);
    var spending = recurring + oneTime, net = income - spending, savingsTarget = sum(L.sav, P);
    return {
      lines: L, income: income, received: sum(L.inc, A), recurring: recurring, oneTime: oneTime,
      spending: spending, spentRecurring: sum(L.exp, A), spentOneTime: sum(L.one, A),
      spent: sum(L.exp, A) + sum(L.one, A), net: net, savingsTarget: savingsTarget, saved: sum(L.sav, A),
      remaining: net - savingsTarget, savingsRate: income > 0 ? net / income : 0
    };
  }

  function categorySummaries(expLines) {
    return CATEGORIES.map(function (c) {
      var items = expLines.filter(function (l) { return l.cat === c.name; });
      var budget = sum(items, P), spent = sum(items, A);
      return { name: c.name, icon: c.icon, items: items, budget: budget, spent: spent, left: budget - spent, pct: budget > 0 ? spent / budget : 0 };
    }).filter(function (c) { return c.items.length > 0; });
  }
  function overBudgetCount(state, mi) {
    return categorySummaries(monthLines(state, mi).exp).filter(function (c) { return c.spent > c.budget; }).length;
  }
  function barTone(p) { return p >= 0.95 ? 'bad' : p >= 0.75 ? 'amber' : 'good'; }

  // Months before the current one use entered actuals (falling back to plan); the rest use the plan.
  function projection(state, currentMi) {
    var cum = 0;
    return MONTHS.map(function (M, mi) {
      var L = monthLines(state, mi), past = mi < currentMi;
      var val = function (x) { return past && x.actual != null ? x.actual : x.planned; };
      var income = sum(L.inc, val), expenses = sum(L.exp, val) + sum(L.one, val);
      var savings = income - expenses; cum += savings;
      return Object.assign({}, M, { income: income, expenses: expenses, savings: savings, cumulative: cum, phase: PHASES[mi], past: past });
    });
  }

  /* ---------- True Balance ---------- */
  function assetValue(state, id) {
    var a = state.assets.find(function (x) { return x.id === id; });
    return a ? (a.value || 0) : 0;
  }
  function setAssetValue(state, id, v) {
    return Object.assign({}, state, { assets: state.assets.map(function (a) { return a.id === id ? Object.assign({}, a, { value: v }) : a; }) });
  }

  function trueBalance(state, now) {
    var bank = assetValue(state, 'checking');
    var look = state.settings.lookahead || 14;
    var base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var bills = [];
    for (var d = 0; d < look; d++) {
      var date = new Date(base.getFullYear(), base.getMonth(), base.getDate() + d);
      var mi = monthIndexOf(date);
      if (mi < 0 || mi > 11) continue;
      var dim = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
      EXPENSES.forEach(function (l) {
        if (!l.due || !isActive(l, mi)) return;
        if (Math.min(l.due, dim) !== date.getDate()) return;
        if (getActual(state, mi, 'exp:' + l.id) != null) return; // entered = paid
        bills.push({ id: l.id, mi: mi, name: l.name, date: date, approx: !!l.approx, amount: l.amount });
      });
    }
    var cmi = monthIndexOf(base), reserved = [], savings = [];
    if (cmi >= 0 && cmi <= 11) {
      var L = monthLines(state, cmi);
      L.exp.concat(L.one).forEach(function (x) {
        if (x.due || !state.settings.reserved[x.id]) return;
        var left = Math.max(0, x.planned - (x.actual || 0));
        if (left > 0) reserved.push({ id: x.id, name: x.name, amount: left, budget: x.planned });
      });
      if (state.settings.includeSavings) {
        L.sav.forEach(function (x) {
          var left = Math.max(0, x.planned - (x.actual || 0));
          if (left > 0) savings.push({ id: x.id, name: x.name, amount: left, budget: x.planned });
        });
      }
    }
    var billsTotal = sum(bills, function (b) { return b.amount; });
    var reservedTotal = sum(reserved, function (b) { return b.amount; });
    var savingsTotal = sum(savings, function (b) { return b.amount; });
    var available = bank - billsTotal - reservedTotal - savingsTotal;
    var ratio = bank > 0 ? available / bank : (available >= 0 ? 1 : -1);
    var tone = ratio > 0.2 ? 'good' : ratio >= 0.1 ? 'warn' : 'bad';
    return { bank: bank, bills: bills, billsTotal: billsTotal, reserved: reserved, reservedTotal: reservedTotal,
      savings: savings, savingsTotal: savingsTotal, available: available, ratio: ratio, tone: tone, lookahead: look };
  }
