<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>Anchor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* ---------- tokens (spec palette) ---------- */
:root {
  --navy: #0A0F1E;
  --side: #0F172A;
  --side-text: #CBD5E1;
  --side-active: #FFFFFF;
  --side-line: #1E293B;
  --bg: #F8FAFC;
  --card: #FFFFFF;
  --border: #E2E8F0;
  --text: #0F172A;
  --muted: #64748B;
  --faint: #94A3B8;
  --subtle: #F1F5F9;
  --hover: #F8FAFC;
  --accent: #0D9488;
  --accent-soft: #CCFBF1;
  --accent-ink: #0F766E;
  --ok: #16A34A;
  --warn: #B45309;
  --bad: #DC2626;
  --bar-ok: #16A34A;
  --bar-warn: #F59E0B;
  --bar-bad: #DC2626;
  --track: #E9EEF4;
  --c1: #0D9488;
  --c2: #6366F1;
  --c3: #F59E0B;
  --pill-bg: #DCFCE7;
  --pill-ink: #15803D;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --side: #0A0F1E;
    --side-line: #1E293B;
    --bg: #0B1120;
    --card: #111827;
    --border: #1F2937;
    --text: #E2E8F0;
    --muted: #94A3B8;
    --faint: #64748B;
    --subtle: #0F172A;
    --hover: #162033;
    --accent: #14B8A6;
    --accent-soft: #134E4A;
    --accent-ink: #5EEAD4;
    --ok: #4ADE80;
    --warn: #FBBF24;
    --bad: #F87171;
    --bar-ok: #22C55E;
    --bar-warn: #F59E0B;
    --bar-bad: #EF4444;
    --track: #1E293B;
    --c1: #14B8A6;
    --c2: #818CF8;
    --c3: #FBBF24;
    --pill-bg: #14532D;
    --pill-ink: #86EFAC;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --side: #0A0F1E;
  --side-line: #1E293B;
  --bg: #0B1120;
  --card: #111827;
  --border: #1F2937;
  --text: #E2E8F0;
  --muted: #94A3B8;
  --faint: #64748B;
  --subtle: #0F172A;
  --hover: #162033;
  --accent: #14B8A6;
  --accent-soft: #134E4A;
  --accent-ink: #5EEAD4;
  --ok: #4ADE80;
  --warn: #FBBF24;
  --bad: #F87171;
  --bar-ok: #22C55E;
  --bar-warn: #F59E0B;
  --bar-bad: #EF4444;
  --track: #1E293B;
  --c1: #14B8A6;
  --c2: #818CF8;
  --c3: #FBBF24;
  --pill-bg: #14532D;
  --pill-ink: #86EFAC;
  --shadow: none;
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.45;
  font-feature-settings: "cv11", "ss01";
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p { margin: 0; }
a { color: var(--accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.strong { font-weight: 600; }
.ok { color: var(--ok); }
.warn { color: var(--warn); }
.bad { color: var(--bad); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12.5px; }
.emoji { margin-right: 8px; font-size: 15px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---------- shell ---------- */
.sidebar {
  position: fixed; top: 0; bottom: 0; left: 0; width: 240px; z-index: 40;
  background: var(--side); color: var(--side-text);
  border-right: 1px solid var(--side-line);
  display: flex; flex-direction: column;
  padding: calc(22px + env(safe-area-inset-top, 0px)) 14px calc(16px + env(safe-area-inset-bottom, 0px));
}
.brand { display: flex; gap: 12px; align-items: center; padding: 0 8px 26px; color: var(--side-active); text-decoration: none !important; }
.brand-mark { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: #0D9488; color: #fff; flex: none; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-name { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.brand-tag { font-size: 11.5px; color: #94A3B8; }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.side-link {
  display: flex; align-items: center; gap: 12px; position: relative;
  padding: 9px 10px; border-radius: 8px; color: var(--side-text); font-weight: 500; text-decoration: none !important;
}
.side-link:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
.side-link.active { background: rgba(255, 255, 255, 0.08); color: var(--side-active); }
.side-link.active::before { content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: #2DD4BF; }
.side-link svg { flex: none; opacity: 0.9; }
.badge-dot { width: 7px; height: 7px; border-radius: 50%; background: #F87171; margin-left: auto; box-shadow: 0 0 0 2px var(--side); }
.side-rule { height: 1px; background: var(--side-line); margin: 14px 4px; }
.side-account { margin-top: auto; display: flex; gap: 10px; align-items: center; padding: 12px 8px 0; border-top: 1px solid var(--side-line); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #1E293B; color: #E2E8F0; display: grid; place-items: center; font-weight: 600; flex: none; }
.acct-text { display: flex; flex-direction: column; min-width: 0; }
.acct-name { color: #fff; font-weight: 500; }
.acct-sub { font-size: 11.5px; color: #94A3B8; }

.main { margin-left: 240px; min-width: 0; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.topbar-inner { max-width: 1200px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 12px; min-height: 64px; }
.page-title { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
.top-mark, .icon-btn.top-settings { display: none; }
.month-select { position: relative; display: inline-flex; align-items: center; }
.month-select select {
  appearance: none; -webkit-appearance: none; border: 1px solid var(--border); background: var(--card);
  border-radius: 9px; padding: 8px 34px 8px 12px; font-weight: 500; font-size: 14px; cursor: pointer; box-shadow: var(--shadow);
}
.month-select svg { position: absolute; right: 10px; pointer-events: none; color: var(--muted); }
.icon-btn { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); border: 1px solid var(--border); background: var(--card); }
.icon-btn.active { color: var(--accent-ink); border-color: var(--accent); }
.content { max-width: 1200px; margin: 0 auto; padding: 24px 32px 56px; display: flex; flex-direction: column; gap: 20px; }
.tabbar { display: none; }

@media (max-width: 1023px) {
  .sidebar { display: none; }
  .main { margin-left: 0; }
  .topbar-inner { padding: 10px 16px; min-height: 56px; }
  .page-title { font-size: 18px; }
  .top-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: #0D9488; color: #fff; flex: none; }
  .icon-btn.top-settings { display: grid; }
  .month-select select { padding: 7px 30px 7px 10px; font-size: 16px; }
  .content { padding: 16px 14px calc(88px + env(safe-area-inset-bottom, 0px)); gap: 14px; }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr);
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--side); border-top: 1px solid var(--side-line);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 4px; color: #94A3B8; font-size: 11px; font-weight: 500; text-decoration: none !important; border-radius: 10px; }
  .tab.active { color: #fff; }
  .tab.active .tab-icon { background: rgba(45, 212, 191, 0.16); color: #5EEAD4; }
  .tab-icon { position: relative; display: grid; place-items: center; width: 44px; height: 28px; border-radius: 14px; }
  .tab-icon .badge-dot { position: absolute; top: 2px; right: 8px; margin: 0; }
}

/* ---------- cards & common ---------- */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
.pad { padding: 20px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 12px; margin-bottom: 14px; flex-wrap: wrap; }
.card-head h2, .tbl-title h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.005em; }
.link { font-size: 13px; font-weight: 500; }
.divider { height: 1px; background: var(--border); margin: 18px 0; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1023px) { .two-col { grid-template-columns: minmax(0, 1fr); gap: 14px; } .pad { padding: 16px; } }

.bar { display: block; height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar-fill { display: block; height: 100%; border-radius: inherit; transition: width 0.3s ease; }
.bar-fill.ok { background: var(--bar-ok); }
.bar-fill.warn { background: var(--bar-warn); }
.bar-fill.bad { background: var(--bar-bad); }
.bar-fill.accent { background: var(--accent); }

.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 9px;
  font-weight: 500; font-size: 13.5px; border: 1px solid var(--border); background: var(--card); color: var(--text); white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.05); background: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.spacer { flex: 1; }

.money-input {
  display: inline-flex; align-items: center; gap: 4px; height: 38px; padding: 0 10px; min-width: 0;
  border: 1px solid var(--border); border-radius: 9px; background: var(--card); color: var(--muted);
}
.money-input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.money-input input, .money-input select { border: 0; outline: 0; background: transparent; color: var(--text); width: 100%; min-width: 0; font-size: 15px; font-variant-numeric: tabular-nums; padding: 0; }
.money-input.select { padding: 0 6px; }
.money-input select { cursor: pointer; }
.money-input.sm { height: 34px; }
.money-input.sm input, .money-input.sm select { font-size: 14px; }
@media (max-width: 1023px) { .money-input input, .money-input select, .money-input.sm input, .money-input.sm select { font-size: 16px; } }

.delta { display: inline-flex; align-items: center; gap: 2px; font-weight: 500; font-size: 13px; font-variant-numeric: tabular-nums; }
.delta-suffix { color: var(--muted); font-weight: 400; }

/* ---------- True Balance (signature) ---------- */
.tb {
  background: var(--navy); color: #E2E8F0; border-radius: 18px; padding: 22px 26px 24px;
  border: 1px solid #1E293B; position: relative; overflow: hidden;
}
.tb::after {
  content: ""; position: absolute; inset: 0 0 auto auto; width: 46%; height: 100%; pointer-events: none;
  background: radial-gradient(120% 90% at 100% 0%, rgba(13, 148, 136, 0.16), transparent 60%);
}
.tb > * { position: relative; z-index: 1; }
.tb-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.tb-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #fff; }
.tb-title svg { color: #2DD4BF; }
.tb-badge { font-size: 11.5px; font-weight: 500; color: #5EEAD4; background: rgba(13, 148, 136, 0.18); border: 1px solid rgba(45, 212, 191, 0.25); padding: 3px 9px; border-radius: 999px; }
.tb-grid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 36px; align-items: stretch; }
.tb-hero { display: flex; flex-direction: column; gap: 8px; }
.tb-label { font-size: 13px; color: #94A3B8; }
.tb-big { font-size: 56px; line-height: 1; font-weight: 600; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
.tone-ok { color: #4ADE80; }
.tone-warn { color: #FBBF24; }
.tone-bad { color: #F87171; }
.tb-status { color: #CBD5E1; font-size: 14px; max-width: 34ch; }
.tb-quote { margin-top: auto; padding-top: 18px; color: #64748B; font-size: 12.5px; max-width: 40ch; }
.tb-ledger { display: flex; flex-direction: column; background: rgba(255, 255, 255, 0.03); border: 1px solid #1E293B; border-radius: 12px; overflow: hidden; }
.tb-bank { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px; padding: 14px 16px; border-bottom: 1px solid #1E293B; }
.tb-row-label { color: #E2E8F0; font-weight: 500; }
.tb-bank .tb-row-label { grid-column: 1; }
.tb-bank-btn { grid-column: 2; grid-row: 1 / span 2; display: inline-flex; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; border-radius: 10px; border: 1px solid #334155; background: rgba(255, 255, 255, 0.04); }
.tb-bank-btn:hover { border-color: #2DD4BF; }
.tb-bank-num { font-size: 22px; font-weight: 600; color: #fff; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.tb-bank-cta { font-size: 12px; font-weight: 500; color: #5EEAD4; background: rgba(13, 148, 136, 0.2); padding: 3px 8px; border-radius: 6px; }
.tb-bank-edit { grid-column: 2; grid-row: 1 / span 2; display: inline-flex; gap: 8px; align-items: center; }
.tb-bank-edit .money-input { background: #0F172A; border-color: #334155; width: 150px; color: #94A3B8; }
.tb-bank-edit .money-input input { color: #fff; font-size: 18px; }
.btn.tb-save { background: #0D9488; border-color: #0D9488; color: #fff; }
.tb-updated { grid-column: 1; font-size: 12px; color: #64748B; }
.tb-ded { border-bottom: 1px solid #1E293B; }
.tb-ded-btn { width: 100%; display: grid; grid-template-columns: 14px 1fr auto 16px; gap: 10px; align-items: center; padding: 11px 16px; }
.tb-ded-btn:hover { background: rgba(255, 255, 255, 0.03); }
.tb-minus { color: #64748B; font-weight: 500; }
.tb-ded-text { display: flex; flex-direction: column; min-width: 0; }
.tb-hint { font-size: 12px; color: #64748B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-ded-amt { font-variant-numeric: tabular-nums; color: #CBD5E1; font-weight: 500; }
.tb-chev { color: #64748B; transition: transform 0.15s ease; }
.tb-ded.open .tb-chev { transform: rotate(90deg); }
.tb-items { list-style: none; margin: 0; padding: 2px 16px 10px 40px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #CBD5E1; }
.tb-items li { display: grid; grid-template-columns: 1fr auto 70px; gap: 10px; align-items: baseline; }
.tb-item-meta { color: #64748B; font-size: 12px; white-space: nowrap; }
.tb-item-amt { text-align: right; font-variant-numeric: tabular-nums; }
.tb-empty { color: #64748B; display: block !important; }
.tb-total { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px; background: rgba(255, 255, 255, 0.03); font-weight: 500; color: #fff; }
.tb-total strong { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }

@media (max-width: 1023px) {
  .tb { padding: 18px 16px 16px; border-radius: 16px; }
  .tb-head { margin-bottom: 12px; }
  .tb-grid { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .tb-big { font-size: 46px; }
  .tb-quote { display: none; }
  .tb-bank { padding: 12px; }
  .tb-bank-num { font-size: 19px; }
  .tb-bank-edit .money-input { width: 120px; }
  .tb-ded-btn { padding: 11px 12px; }
  .tb-items { padding: 2px 12px 10px 36px; }
  .tb-items li { grid-template-columns: 1fr auto; }
  .tb-items .tb-item-meta { grid-column: 1; grid-row: 2; }
  .tb-items .tb-item-amt { grid-column: 2; grid-row: 1; }
  .tb-total { padding: 12px; }
}

/* ---------- KPI strip ---------- */
.kpis, .strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
.strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpi, .stat { display: flex; flex-direction: column; gap: 4px; padding: 16px 20px; min-width: 0; }
.kpi + .kpi, .stat + .stat { border-left: 1px solid var(--border); }
.kpi-label { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.kpi-value { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kpi-sub { font-size: 12.5px; color: var(--muted); }
.stat .bar { margin: 4px 0 2px; }
@media (max-width: 1023px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi { padding: 13px 14px; }
  .kpi:nth-child(3) { border-left: 0; }
  .kpi:nth-child(n + 3) { border-top: 1px solid var(--border); }
  .kpi-value { font-size: 20px; }
  .strip { grid-template-columns: minmax(0, 1fr); }
  .stat { padding: 13px 14px; }
  .stat + .stat { border-left: 0; border-top: 1px solid var(--border); }
}

/* ---------- dashboard lists ---------- */
.cat-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.cat-list li, .goal-mini { display: grid; gap: 6px; }
.cat-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.cat-name { font-weight: 500; display: inline-flex; align-items: center; }
.cat-figs { font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
.cat-left { font-size: 12.5px; text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
.nw-figure { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.nw-big { font-size: 30px; font-weight: 600; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
.nw-big.xl { font-size: 40px; }
.nw-split-line { margin: 4px 0 10px; }

/* ---------- charts ---------- */
.chart { width: 100%; min-width: 0; }
.chart svg { display: block; overflow: visible; }
.chart-readout { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; min-height: 24px; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.chart-readout strong { font-size: 18px; font-weight: 600; }
.gridline { stroke: var(--border); stroke-width: 1; }
.axis-zero { stroke: var(--faint); stroke-width: 1; }
.tick { fill: var(--muted); font-size: 11px; font-family: inherit; font-variant-numeric: tabular-nums; }
.tick-active { fill: var(--text); font-weight: 600; }
.bar-grow { fill: var(--c1); opacity: 0.72; transition: opacity 0.15s; }
.bar-dip { fill: var(--c3); opacity: 0.8; transition: opacity 0.15s; }
.bar-grow.is-active, .bar-dip.is-active { opacity: 1; }
.line { fill: none; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
.line.s-plan { stroke: var(--c2); stroke-dasharray: 5 5; }
.line.s-actual { stroke: var(--c1); }
.dot.s-actual { fill: var(--c1); stroke: var(--card); stroke-width: 2; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.card-head .legend { margin-top: 0; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.swatch.s-plan { background: repeating-linear-gradient(90deg, var(--c2) 0 4px, transparent 4px 7px); }
.swatch.s-actual, .swatch.s-grow { background: var(--c1); }
.swatch.s-grow, .swatch.s-dip { height: 10px; width: 10px; border-radius: 3px; }
.swatch.s-dip { background: var(--c3); }

/* ---------- budget flow ---------- */
.flow {
  display: grid; grid-template-columns: 1fr auto 1fr auto 1.2fr; align-items: center; gap: 0;
  background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden;
}
.flow-item { display: flex; flex-direction: column; gap: 3px; padding: 16px 20px; min-width: 0; }
.flow-item.emph { background: var(--subtle); align-self: stretch; justify-content: center; }
.flow-label { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.flow-val { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.flow-val.big { font-size: 30px; }
.flow-sub { font-size: 12.5px; color: var(--muted); }
.flow-op { font-size: 22px; color: var(--faint); padding: 0 4px; }
@media (max-width: 1023px) {
  .flow { grid-template-columns: minmax(0, 1fr); }
  .flow-op { display: none; }
  .flow-item { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 0 12px; padding: 11px 14px; }
  .flow-item + .flow-op + .flow-item { border-top: 1px solid var(--border); }
  .flow-label { grid-column: 1; grid-row: 1; font-size: 13.5px; color: var(--text); }
  .flow-sub { grid-column: 1; grid-row: 2; }
  .flow-val { grid-column: 2; grid-row: 1 / span 2; font-size: 18px; align-self: center; }
  .flow-val.big { font-size: 24px; }
  .flow > div:nth-of-type(2) .flow-label::before { content: "− "; color: var(--faint); }
  .flow > div:nth-of-type(3) .flow-label::before { content: "= "; color: var(--faint); }
}

/* ---------- tables ---------- */
.tbl { overflow: hidden; }
.tbl-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px 20px 12px; flex-wrap: wrap; }
.thead, .trow {
  display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, 104px); column-gap: 16px; align-items: center;
  padding: 0 20px; width: 100%;
}
.thead { background: var(--subtle); color: var(--muted); font-size: 12px; font-weight: 500; min-height: 34px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.trow { min-height: 48px; border-bottom: 1px solid var(--border); padding-top: 8px; padding-bottom: 8px; }
button.trow:hover { background: var(--hover); }
.row-wrap.editing > .trow { background: var(--hover); }
.trow.indent .cell-label { padding-left: 24px; }
.cell-label { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; min-width: 0; }
.line-name { font-weight: 400; color: var(--text); }
.due { font-size: 12px; color: var(--muted); }
.pill { font-size: 11px; font-weight: 500; color: var(--pill-ink); background: var(--pill-bg); padding: 1px 7px; border-radius: 999px; }
.trow.onetime .line-name, .trow.onetime .num { font-style: italic; color: var(--muted); }
.trow.group { background: var(--card); min-height: 56px; }
.trow.group .cell-label { flex-direction: column; align-items: stretch; gap: 6px; flex-wrap: nowrap; }
.trow.group .bar { max-width: 220px; }
.group-name { font-weight: 600; display: inline-flex; align-items: center; }
.trow.total { font-weight: 600; border-bottom: 0; background: var(--subtle); min-height: 50px; }
.trow.static { cursor: default; }
.trow.two-cols, .thead.two-cols { grid-template-columns: minmax(0, 1fr) auto; }
.trow.group.two-cols { min-height: 40px; background: var(--subtle); font-size: 13px; }

.editor, .detail { padding: 12px 20px 16px 44px; border-bottom: 1px solid var(--border); background: var(--hover); display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.detail { flex-direction: column; align-items: stretch; padding-left: 20px; }
.editor-field, .field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.editor-field .money-input { width: 160px; }
.editor-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.editor-hint { width: 100%; font-size: 12.5px; color: var(--muted); }
.fields { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.field.wide { grid-column: span 2; }
.field .money-input { width: 100%; }
.field-editor { display: flex; flex-direction: column; gap: 12px; }

/* cards & loans grids */
.cards-grid { grid-template-columns: minmax(0, 1.4fr) 88px 80px minmax(120px, 1fr) 64px 92px; }
.loans-grid { grid-template-columns: minmax(0, 1.4fr) 92px 64px 84px 92px 104px; }
.c-util { display: grid; grid-template-columns: 1fr 40px; gap: 8px; align-items: center; }
.util-pct { font-size: 12.5px; font-weight: 500; }
.m-only { display: none; }
.has-tip { position: relative; }
.hover-tip {
  display: none; position: absolute; right: 20px; top: calc(100% - 6px); z-index: 10; max-width: 340px;
  background: var(--navy); color: #E2E8F0; font-size: 12.5px; padding: 8px 11px; border-radius: 9px; pointer-events: none;
  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
}
@media (hover: hover) and (min-width: 1024px) { .has-tip:hover .hover-tip { display: block; } }

@media (max-width: 1023px) {
  .tbl-title { padding: 14px 14px 10px; }
  .thead, .trow { grid-template-columns: minmax(0, 1fr) repeat(3, 62px); column-gap: 8px; padding: 0 14px; font-size: 13.5px; }
  .trow { padding-top: 10px; padding-bottom: 10px; }
  .thead { font-size: 11.5px; }
  .trow.indent .cell-label { padding-left: 0; }
  .trow.group .bar { max-width: none; }
  .cell-label { flex-direction: column; gap: 1px; }
  .editor { padding: 12px 14px 14px; }
  .editor-field { width: 100%; }
  .editor-field .money-input { width: 100%; }
  .editor-actions { width: 100%; }
  .editor-actions .btn.primary { margin-left: auto; }
  .detail { padding: 12px 14px 14px; }
  .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .thead.cards-grid, .thead.loans-grid { display: none; }
  .cards-grid, .loans-grid { grid-template-columns: minmax(0, 1fr) auto; row-gap: 6px; }
  .cards-grid { grid-template-areas: "name bal" "util lim" "apr min"; }
  .loans-grid { grid-template-areas: "name bal" "apr pay" "off int"; }
  .c-name, .l-name { grid-area: name; }
  .c-bal, .l-bal { grid-area: bal; font-weight: 600; }
  .c-lim { grid-area: lim; }
  .c-util { grid-area: util; grid-template-columns: minmax(0, 1fr) 40px; }
  .c-apr { grid-area: apr; text-align: left; }
  .c-min { grid-area: min; }
  .l-apr { grid-area: apr; text-align: left; }
  .l-pay { grid-area: pay; }
  .l-off { grid-area: off; text-align: left; }
  .l-int { grid-area: int; }
  .cards-grid .num:not(.c-bal):not(.l-bal), .loans-grid .num:not(.c-bal):not(.l-bal) { font-size: 12.5px; }
  .m-only { display: inline; }
}

/* ---------- savings ---------- */
.goal-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.goal { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.goal-title { font-size: 12.5px; font-weight: 500; color: var(--muted); }
.goal-value { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.goal-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.goal-prog { font-size: 12.5px; font-weight: 500; }
.goal-note { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 8px; margin-top: 4px; }
@media (max-width: 1180px) { .goal-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .goal-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; } .goal-value { font-size: 22px; } }

.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.proj { width: 100%; min-width: 620px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.proj th, .proj td { padding: 11px 20px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
.proj thead th { background: var(--subtle); color: var(--muted); font-size: 12px; font-weight: 500; border-top: 1px solid var(--border); }
.proj tbody th { font-weight: 500; }
.proj .num { text-align: right; }
.proj tbody tr:last-child th, .proj tbody tr:last-child td { border-bottom: 0; }
.proj tr.is-now { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.phase { font-size: 12.5px; color: var(--muted); }
@media (max-width: 1023px) { .proj th, .proj td { padding: 10px 12px; } }

/* ---------- net worth ---------- */
.nw-hero { display: flex; flex-direction: column; gap: 16px; }
.nw-hero-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.nw-split { display: flex; gap: 28px; }
.nw-split > div { display: flex; flex-direction: column; gap: 2px; }
.nw-mid { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
@media (max-width: 1023px) { .nw-big.xl { font-size: 34px; } }

/* ---------- settings ---------- */
.settings { display: flex; flex-direction: column; gap: 4px; }
.settings > h2 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--border); }
.setting.stack { flex-direction: column; align-items: stretch; }
.s-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.s-label { font-weight: 500; }
.s-sub { font-size: 12.5px; color: var(--muted); }
.setting .money-input { width: 140px; flex: none; }
.segmented { display: inline-flex; background: var(--subtle); border: 1px solid var(--border); border-radius: 10px; padding: 3px; flex: none; }
.segmented button { padding: 6px 12px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--muted); }
.segmented button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08); }
.toggle { width: 44px; height: 26px; border-radius: 999px; background: var(--track); position: relative; flex: none; transition: background 0.15s; }
.toggle .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); transition: transform 0.15s; }
.toggle.on { background: var(--accent); }
.toggle.on .knob { transform: translateX(18px); }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.check { display: inline-flex; gap: 8px; align-items: center; padding: 7px 12px; border: 1px solid var(--border); border-radius: 9px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.plan-head, .plan-row { display: grid; grid-template-columns: minmax(0, 1fr) 120px 130px 130px; gap: 10px; align-items: center; }
.plan-head { font-size: 12px; color: var(--muted); font-weight: 500; padding: 10px 0 6px; border-top: 1px solid var(--border); margin-top: 10px; }
.plan-row { padding: 6px 0; }
.plan-name { font-weight: 400; }
.plan-name.onetime { font-style: italic; color: var(--muted); }
.data-actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 4px; }
@media (max-width: 1023px) {
  .plan-head { display: none; }
  .plan-row { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 10px 0; border-top: 1px solid var(--border); }
  .plan-name { grid-column: 1 / -1; }
  .setting { flex-wrap: wrap; }
}

</style>
